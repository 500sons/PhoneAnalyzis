name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract ZIP
        id: extract
        run: |
          if [ -f "phoneanaliz.zip" ]; then
            ZIP_FILE="phoneanaliz.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP-файл не найден в репозитории"
            exit 1
          fi

          echo "Используется архив: $ZIP_FILE"
          mkdir -p build_src
          unzip -q "$ZIP_FILE" -d build_src

          GRADLE_FILE=$(find build_src -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Не найден settings.gradle(.kts) внутри архива"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-analyzis
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30
